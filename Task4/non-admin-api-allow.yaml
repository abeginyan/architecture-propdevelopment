# Обычная пара сервисов: front-end <-> back-end-api. Трафик разрешён в обе стороны, порт 80.
# Остальным подам доступ к этим сервисам закрыт (действует default-deny-all).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: back-end-api-allow-front-end
  namespace: traffic-demo
spec:
  podSelector:
    matchLabels:
      role: back-end-api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              role: front-end
      ports:
        - {protocol: TCP, port: 80}
  egress:
    - to:
        - podSelector:
            matchLabels:
              role: front-end
      ports:
        - {protocol: TCP, port: 80}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: front-end-allow-back-end-api
  namespace: traffic-demo
spec:
  podSelector:
    matchLabels:
      role: front-end
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              role: back-end-api
      ports:
        - {protocol: TCP, port: 80}
  egress:
    - to:
        - podSelector:
            matchLabels:
              role: back-end-api
      ports:
        - {protocol: TCP, port: 80}
